# GoReleaser config: builds claude-profiles.exe (terminal) and
# claude-profiles-gui.exe (window) for Windows and publishes a
# GitHub release when a tag like v1.2.3 is pushed. See .github/workflows/release.yml.
version: 2

project_name: claude-profiles

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Embed the icon and stamp this release's version into the .exe files.
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64,arm64 --product-version={{ .Major }}.{{ .Minor }}.{{ .Patch }} --file-version={{ .Major }}.{{ .Minor }}.{{ .Patch }}

builds:
  - id: claude-profiles
    main: .
    binary: claude-profiles
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # Windowed version: same code built with the gui tag, no console window.
  - id: claude-profiles-gui
    main: .
    binary: claude-profiles-gui
    tags:
      - gui
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }}

archives:
  - id: default
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
