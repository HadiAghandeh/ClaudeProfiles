# GoReleaser config, run by .github/workflows/release.yml when a tag like
# v1.2.3 is pushed. It publishes:
#   - claude-profiles      terminal app for Windows, macOS and Linux (amd64, arm64)
#   - claude-profiles-gui  window app for Windows (amd64, arm64) and Linux (amd64)
version: 2

project_name: claude-profiles

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Embed the icon and stamp this release's version into the Windows .exe files.
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64,arm64 --product-version={{ .Major }}.{{ .Minor }}.{{ .Patch }} --file-version={{ .Major }}.{{ .Minor }}.{{ .Patch }}

builds:
  # Terminal app: pure Go, cross-compiled for every platform.
  - id: claude-profiles
    main: .
    binary: claude-profiles
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # Windows window app (WebView2, no CGO), with no console window.
  - id: claude-profiles-gui-windows
    main: .
    binary: claude-profiles-gui
    tags: [gui]
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }}

  # Linux window app (WebKitGTK through CGO). Built natively on the release
  # runner, which has the GTK/WebKit headers; PKG_CONFIG_PATH (set by the
  # workflow) maps webkit2gtk-4.0 to 4.1.
  - id: claude-profiles-gui-linux
    main: .
    binary: claude-profiles-gui
    tags: [gui]
    env:
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Windows and Linux x64 archives also hold the window app; macOS and
    # Linux arm64 have the terminal app only.
    allow_different_binary_count: true
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
