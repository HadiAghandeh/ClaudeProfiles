# GoReleaser config: builds claude-profiles.exe for Windows and publishes a
# GitHub release when a tag like v1.2.3 is pushed. See .github/workflows/release.yml.
version: 2

project_name: claude-profiles

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: claude-profiles
    main: .
    binary: claude-profiles
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
