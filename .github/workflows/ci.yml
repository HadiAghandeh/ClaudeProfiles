name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Vet (GUI build)
        run: go vet -tags gui ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o claude-profiles.exe .

      - name: Build GUI
        run: go build -tags gui -ldflags "-H=windowsgui" -o claude-profiles-gui.exe .
